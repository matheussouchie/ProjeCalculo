<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <title>ProjeCálculo ícone</title>
  <defs>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="500" height="500" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="500" height="500" rx="110" ry="110" fill="#0d2245"/>

  <g clip-path="url(#roundedClip)">
    <!-- Blueprint grid lines -->
    <line x1="120" y1="0" x2="120" y2="500" stroke="#1a3a6e" stroke-width="1.5" opacity="0.7"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#1a3a6e" stroke-width="1.5" opacity="0.7"/>
    <line x1="290" y1="0" x2="290" y2="500" stroke="#1a3a6e" stroke-width="1.5" opacity="0.5"/>
    <line x1="370" y1="0" x2="370" y2="500" stroke="#1a3a6e" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="100" x2="500" y2="100" stroke="#1a3a6e" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="185" x2="500" y2="185" stroke="#1a3a6e" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="285" x2="500" y2="285" stroke="#1a3a6e" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="375" x2="500" y2="375" stroke="#1a3a6e" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="100" x2="290" y2="285" stroke="#1e4a8a" stroke-width="1" opacity="0.5"/>
    <line x1="290" y1="100" x2="120" y2="285" stroke="#1e4a8a" stroke-width="1" opacity="0.5"/>

    <!-- Blueprint circles/arcs -->
    <circle cx="200" cy="220" r="190" fill="none" stroke="#1e4a8a" stroke-width="2" opacity="0.6"/>
    <path d="M 200 100 A 90 90 0 0 1 380 185" fill="none" stroke="#2255aa" stroke-width="2" opacity="0.7"/>

    <!-- Dimension lines -->
    <line x1="75" y1="480" x2="290" y2="480" stroke="#2255aa" stroke-width="1.2" opacity="0.5"/>
    <line x1="75" y1="474" x2="75" y2="486" stroke="#2255aa" stroke-width="1.2" opacity="0.5"/>
    <line x1="290" y1="474" x2="290" y2="486" stroke="#2255aa" stroke-width="1.2" opacity="0.5"/>
    <line x1="75" y1="30" x2="75" y2="390" stroke="#2255aa" stroke-width="1.2" opacity="0.4"/>

    <!-- P letter -->
    <rect x="90" y="100" width="55" height="290" fill="white"/>
    <rect x="90" y="100" width="155" height="52" fill="white"/>
    <rect x="90" y="215" width="155" height="52" fill="white"/>
    <rect x="200" y="100" width="45" height="167" fill="white"/>
    <!-- P inner cutout -->
    <rect x="148" y="155" width="95" height="58" fill="#0d2245"/>

    <!-- Blueprint ticks on P -->
    <line x1="90" y1="130" x2="106" y2="130" stroke="#1a3a6e" stroke-width="2" opacity="0.8"/>
    <line x1="90" y1="155" x2="106" y2="155" stroke="#1a3a6e" stroke-width="2" opacity="0.8"/>
    <line x1="90" y1="180" x2="106" y2="180" stroke="#1a3a6e" stroke-width="2" opacity="0.8"/>
    <line x1="90" y1="205" x2="106" y2="205" stroke="#1a3a6e" stroke-width="2" opacity="0.8"/>
    <line x1="90" y1="255" x2="106" y2="255" stroke="#1a3a6e" stroke-width="2" opacity="0.8"/>
    <line x1="90" y1="280" x2="106" y2="280" stroke="#1a3a6e" stroke-width="2" opacity="0.8"/>
    <line x1="90" y1="305" x2="106" y2="305" stroke="#1a3a6e" stroke-width="2" opacity="0.8"/>
    <line x1="90" y1="330" x2="106" y2="330" stroke="#1a3a6e" stroke-width="2" opacity="0.8"/>

    <!-- C letter -->
    <path d="M 385 235 A 135 135 0 1 0 385 310 L 350 310 A 100 100 0 1 1 350 235 Z" fill="white"/>
    <rect x="300" y="215" width="120" height="120" fill="#0d2245"/>
    <circle cx="245" cy="272" r="90" fill="#0d2245"/>

    <!-- Blueprint wheel inside C -->
    <circle cx="245" cy="272" r="72" fill="none" stroke="#2255aa" stroke-width="2" opacity="0.7"/>
    <line x1="245" y1="200" x2="245" y2="344" stroke="#2255aa" stroke-width="1.5" opacity="0.6"/>
    <line x1="173" y1="272" x2="317" y2="272" stroke="#2255aa" stroke-width="1.5" opacity="0.6"/>
    <line x1="194" y1="221" x2="296" y2="323" stroke="#2255aa" stroke-width="1.5" opacity="0.5"/>
    <line x1="296" y1="221" x2="194" y2="323" stroke="#2255aa" stroke-width="1.5" opacity="0.5"/>

    <!-- Corner mark -->
    <polygon points="355,340 382,340 382,368" fill="#2a5ccc" opacity="0.9"/>

    <!-- Blueprint dots -->
    <circle cx="290" cy="185" r="5" fill="#2a5ccc" opacity="0.8"/>
    <circle cx="120" cy="100" r="4" fill="#2a5ccc" opacity="0.7"/>
  </g>
</svg>
